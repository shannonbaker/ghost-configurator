[widget]
schema_version=1
id=rc_menu
title=RC Menu
section=rc_menu.0
binary=/record/GHOST_DP/bin/ghost_dp_widget_rc_menu
description=RC-controlled menu opened by a configurable double-high channel gesture
field_shm=true
display_scale=false
preview=none
order=10

[option.visible]
type=boolean
label=Enabled
default=false
role=visible
stick_menu=never

[option.activation_field]
type=field
label=Activation RC channel
group=Activation gesture
default=36
required_hz=20
arg=--activation-field
stick_menu=never

[option.gesture_window_ms]
type=integer
label=Double-high window (ms)
group=Activation gesture
default=1500
min=250
max=5000
arg=--gesture-window-ms
stick_menu=optional

[option.debounce_ms]
type=integer
label=Switch debounce (ms)
group=Activation gesture
default=80
min=20
max=500
arg=--debounce-ms
stick_menu=optional

[option.high_threshold]
type=integer
label=High threshold (raw PWM)
group=Activation gesture
default=1800
min=1500
max=2200
arg=--high-threshold
stick_menu=optional

[option.low_threshold]
type=integer
label=Low threshold (raw PWM)
group=Activation gesture
default=1200
min=800
max=1500
arg=--low-threshold
stick_menu=optional

[option.roll_field]
type=field
subscription=runtime
label=Roll navigation field
group=Navigation
default=32
required_hz=20
arg=--roll-field
stick_menu=never

[option.pitch_field]
type=field
subscription=runtime
label=Pitch navigation field
group=Navigation
default=33
required_hz=20
arg=--pitch-field
stick_menu=never

[option.yaw_field]
type=field
subscription=runtime
label=Yaw navigation field
group=Navigation
default=34
required_hz=20
arg=--yaw-field
stick_menu=never

[option.background_opacity]
type=integer
label=Background opacity
default=92
min=0
max=100
step=5
arg=--background-opacity
stick_menu=default
unit=%
transform=percent_to_alpha

[option.panel_overlap_px]
type=integer
label=Panel overlap (px at 1080p)
default=90
min=0
max=300
step=5
arg=--panel-overlap-px
stick_menu=default

[option.text_px]
type=integer
label=Text size (px at 1080p)
default=27
min=14
max=54
arg=--text-px
stick_menu=default

[option.stale_ms]
type=integer
label=RC stale timeout (ms)
default=2500
min=1200
max=10000
arg=--stale-ms
stick_menu=optional

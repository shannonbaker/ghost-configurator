[widget]
builtin=true
schema_version=1
id=sticks
title=RC Sticks
section=sticks.0
binary=/record/GHOST_DP/bin/ghost_dp_widget_sticks
description=Transmitter stick position display
order=30

[option.visible]
type=boolean
label=Enabled
default=true
role=visible
stick_menu=never

[option.mode]
type=select
label=Stick mode
default=2
values=1,2
stick_menu=default
control=sticksMode

[option.roll_field]
type=field
label=Roll channel
default=32
min=1
max=65535
stick_menu=never
control=sticksRoll

[option.pitch_field]
type=field
label=Pitch channel
default=33
min=1
max=65535
stick_menu=never
control=sticksPitch

[option.yaw_field]
type=field
label=Yaw channel
default=34
min=1
max=65535
stick_menu=never
control=sticksYaw

[option.throttle_field]
type=field
label=Throttle channel
default=35
min=1
max=65535
stick_menu=never
control=sticksThrottle

[option.reverse_roll]
type=boolean
label=Reverse roll
default=false
stick_menu=default
control=sticksReverseRoll

[option.reverse_pitch]
type=boolean
label=Reverse pitch
default=false
stick_menu=default
control=sticksReversePitch

[option.reverse_yaw]
type=boolean
label=Reverse yaw
default=false
stick_menu=default
control=sticksReverseYaw

[option.reverse_throttle]
type=boolean
label=Reverse throttle
default=false
stick_menu=default
control=sticksReverseThrottle

[option.position_x]
type=integer
label=X position
default=1340
min=0
max=1919
step=10
stick_menu=optional
control=sticksX

[option.position_y]
type=integer
label=Y position
default=750
min=0
max=1079
step=10
stick_menu=optional
control=sticksY

[option.size_percent]
type=integer
label=Size
default=100
min=25
max=200
step=5
stick_menu=default
control=sticksSize

[option.max_fps]
type=integer
label=Display rate
default=30
min=1
max=60
step=1
stick_menu=optional
control=sticksFps

[option.minimum_data_hz]
type=integer
label=Minimum data rate
default=10
min=1
max=100
step=1
stick_menu=optional
control=sticksMinimumDataHz

[option.data_hz]
type=integer
label=Preferred data rate
default=20
min=1
max=100
step=1
stick_menu=optional
control=sticksDataHz

[option.stale_timeout_ms]
type=integer
label=Stale timeout
default=2500
min=1200
max=10000
step=100
stick_menu=optional
control=sticksStale

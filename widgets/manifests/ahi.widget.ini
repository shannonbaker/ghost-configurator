[widget]
builtin=true
schema_version=1
id=ahi
title=Artificial Horizon
section=ahi.0
binary=/record/GHOST_DP/bin/ghost_dp_widget_ahi
description=Flight-controller attitude horizon line
order=20

[option.visible]
type=boolean
label=Enabled
default=true
role=visible
stick_menu=never

[option.pitch_field]
type=field
label=Pitch field
default=1
min=1
max=65535
stick_menu=never
control=ahiPitch

[option.roll_field]
type=field
label=Roll field
default=2
min=1
max=65535
stick_menu=never
control=ahiRoll

[option.center_x]
type=integer
label=Horizontal position
default=5000
min=0
max=10000
step=100
stick_menu=optional
control=ahiX

[option.center_y]
type=integer
label=Vertical position
default=5000
min=0
max=10000
step=100
stick_menu=optional
control=ahiY

[option.width]
type=integer
label=Width
default=4000
min=500
max=10000
step=100
stick_menu=optional
control=ahiWidth

[option.height]
type=integer
label=Height
default=5000
min=500
max=10000
step=100
stick_menu=optional
control=ahiHeight

[option.vertical_range_degrees]
type=integer
label=Vertical range (degrees)
default=90
min=20
max=180
step=5
stick_menu=default
control=ahiPitchScale

[option.line_width]
type=integer
label=Line thickness (px)
default=3
min=1
max=12
step=1
stick_menu=default
control=ahiLineWidth

[option.smoothing]
type=number
label=Smoothing
default=0
min=0
max=10
step=0.5
stick_menu=default
control=ahiSmoothing

[option.reverse_pitch]
type=boolean
label=Reverse pitch
default=false
stick_menu=default
control=ahiReversePitch

[option.reverse_roll]
type=boolean
label=Reverse roll
default=false
stick_menu=default
control=ahiReverseRoll

[option.test_mode]
type=boolean
label=Test mode (animate AHI)
default=false
stick_menu=never
control=ahiTestMode

[option.prediction]
type=boolean
label=Prediction (up to 50 ms)
default=true
stick_menu=default
control=ahiPrediction

[option.max_fps]
type=integer
label=Display rate
default=30
min=1
max=60
step=1
stick_menu=optional
control=ahiFps

[option.minimum_data_hz]
type=integer
label=Minimum data rate
default=20
min=1
max=100
step=1
stick_menu=optional
control=ahiMinimumDataHz

[option.data_hz]
type=integer
label=Preferred data rate
default=30
min=1
max=100
step=1
stick_menu=optional
control=ahiDataHz

[option.stale_timeout_ms]
type=integer
label=Stale timeout
default=2500
min=1200
max=10000
step=100
stick_menu=optional
control=ahiStale

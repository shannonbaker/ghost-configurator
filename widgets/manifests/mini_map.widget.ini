[widget]
schema_version=1
id=mini_map
title=Mini Map
section=mini_map.0
description=North-up local GPS flight track with home distance and breadcrumb trail
field_shm=true
display_scale=true
geometry_owner=manager
geometry_x=position_x
geometry_y=position_y
geometry_width=width
geometry_height=height
geometry_lock_aspect=true
preview=rectangle
order=45

[option.visible]
type=boolean
label=Enabled
default=false
role=visible
stick_menu=never

[option.position_x]
type=logical_x
label=X position
default=40
min=0
max=1919
stick_menu=optional

[option.position_y]
type=logical_y
label=Y position
default=650
min=0
max=1079
stick_menu=optional

[option.width]
type=logical_width
label=Width
default=360
min=180
max=900
stick_menu=optional

[option.height]
type=logical_height
label=Height
default=360
min=180
max=900
stick_menu=optional

[option.refresh_hz]
type=integer
label=Refresh rate
default=10
min=1
max=30
unit=Hz
stick_menu=optional

[option.latitude_field]
type=field
label=Latitude field
default=4
required_hz=5
stick_menu=never

[option.longitude_field]
type=field
label=Longitude field
default=5
required_hz=5
stick_menu=never

[option.gps_fix_field]
type=field
label=GPS fix field
default=14
required_hz=5
stick_menu=never

[option.heading_field]
type=field
label=Heading field
default=3
required_hz=10
stick_menu=never

[option.auto_scale]
type=boolean
label=Automatic scale
default=true
stick_menu=default

[option.fixed_radius_metres]
type=number
label=Fixed radius
default=100
min=10
max=10000
step=10
unit=m
stick_menu=default

[option.show_trail]
type=boolean
label=Show trail
default=true
stick_menu=default

[option.trail_points]
type=integer
label=Trail points
default=300
min=20
max=2000
step=10
stick_menu=optional

[option.breadcrumb_metres]
type=number
label=Breadcrumb spacing
default=1
min=0.2
max=50
step=0.2
unit=m
stick_menu=optional

[option.show_grid]
type=boolean
label=Show grid
default=true
stick_menu=default

[option.show_heading]
type=boolean
label=Show heading
default=true
stick_menu=default

[option.show_distance]
type=boolean
label=Show home distance
default=true
stick_menu=default

[option.background_opacity]
type=integer
label=Background opacity
default=65
min=0
max=100
step=1
unit=%
stick_menu=default

[option.test_mode]
type=boolean
label=Test mode
default=false
stick_menu=default

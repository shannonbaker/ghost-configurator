label=Y position
default=620
min=0
max=1079
stick_menu=optional

[option.width]
type=logical_width
label=Width
default=840
min=360
max=1800
stick_menu=optional

[option.height]
type=logical_height
label=Height
default=360
min=220
max=900
stick_menu=optional

[option.max_fps]
type=integer
label=Graph refresh rate
default=30
min=5
max=60
stick_menu=optional

[option.axis]
type=select
label=Axis
default=ROLL
values=ROLL,PITCH,YAW
stick_menu=default

[option.text_size_px]
type=integer
label=Text size (px)
default=16
min=10
max=36

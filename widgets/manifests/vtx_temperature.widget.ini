[widget]
schema_version=1
id=vtx_temperature
title=VTX temperature
section=vtx_temperature.0
binary=/record/GHOST_DP/bin/ghost_dp_widget_vtx_temperature
description=Compact live VTX temperature from the Goggles X baseband status source
field_shm=false
display_scale=true
geometry_owner=widget
geometry_x=position_x
geometry_y=position_y
geometry_width=width
geometry_height=height
geometry_lock_aspect=false
preview=text
order=45

[option.visible]
type=boolean
label=Enabled
default=false
role=visible
stick_menu=never

[option.position_x]
type=logical_x
label=X position
default=24
min=0
max=1919
arg=--x
stick_menu=optional

[option.position_y]
type=logical_y
label=Y position
default=24
min=0
max=1079
arg=--y
stick_menu=optional

[option.width]
type=logical_width
label=Width
default=230
min=120
max=600
arg=--w
stick_menu=optional

[option.height]
type=logical_height
label=Height
default=58
min=36
max=180
arg=--h
stick_menu=optional

[option.text_px]
type=integer
label=Text size
default=22
min=10
max=64
arg=--text-px
stick_menu=default

[option.background_opacity]
type=integer
label=Background opacity
default=59
min=0
max=100
step=1
unit=%
transform=percent_to_alpha
arg=--background-opacity
stick_menu=default

[option.refresh_hz]
type=integer
label=Refresh rate
default=4
min=1
max=20
arg=--hz
stick_menu=optional

[option.stale_timeout_ms]
type=integer
label=Stale timeout
default=3000
min=0
max=60000
step=100
unit=ms
arg=--stale-ms
stick_menu=optional

[widget]
schema_version=1
id=vrx_status_bar
title=VRX status bar
section=vrx_status_bar.0
binary=/record/GHOST_DP/bin/ghost_widget_vrx_status_bar
description=Configurable horizontal VTX and VRX power, temperature and link status
field_shm=false
field_policies=true
display_scale=true
geometry_owner=widget
geometry_x=position_x
geometry_y=position_y
geometry_width=width
geometry_height=height
geometry_lock_aspect=false
preview=rectangle
order=30

[option.visible]
type=boolean
label=Enabled
default=false
role=visible
stick_menu=never

[option.elements_configured]
type=boolean
label=Element selection active
default=true
arg=--elements-configured
hidden=true
stick_menu=never

[option.show_vtx_voltage]
type=boolean
label=VTX voltage
default=true
arg=--show-vtx-voltage
stick_menu=default

[option.show_vrx_voltage]
type=boolean
label=VRX voltage
default=true
arg=--show-vrx-voltage
stick_menu=default

[option.show_vtx_temperature]
type=boolean
label=VTX temperature
default=true
arg=--show-vtx-temperature
stick_menu=default

[option.show_vrx_temperature]
type=boolean
label=VRX temperature
default=true
arg=--show-vrx-temperature
stick_menu=default

[option.show_vtx_rf_power]
type=boolean
label=VTX RF power
default=true
arg=--show-vtx-rf-power
stick_menu=default

[option.show_vrx_rf_power]
type=boolean
label=VRX RF power
default=true
arg=--show-vrx-rf-power
stick_menu=default

[option.show_vtx_snr]
type=boolean
label=VTX SNR
default=true
arg=--show-vtx-snr
stick_menu=default

[option.show_vrx_snr]
type=boolean
label=VRX SNR
default=true
arg=--show-vrx-snr
stick_menu=default

[option.show_bitrate]
type=boolean
label=Link Mbps
default=true
arg=--show-bitrate
stick_menu=default

[option.show_latency]
type=boolean
label=Latency
default=true
arg=--show-latency
stick_menu=default

[option.show_bitrate_graph]
type=boolean
label=Mbps history graph
default=true
arg=--show-bitrate-graph
stick_menu=default

[option.show_latency_graph]
type=boolean
label=Latency history graph
default=true
arg=--show-latency-graph
stick_menu=default

[option.show_bitrate_value]
type=boolean
label=Mbps value
default=true
arg=--show-bitrate-value
stick_menu=default

[option.show_latency_value]
type=boolean
label=Latency value
default=true
arg=--show-latency-value
stick_menu=default

[option.history_seconds]
type=integer
label=Graph history
default=60
min=10
max=600
step=10
unit=s
arg=--history-seconds
stick_menu=default

[option.show_distance]
type=boolean
label=Distance
default=true
arg=--show-distance
stick_menu=default

[option.show_signal]
type=boolean
label=Signal bars
default=true
arg=--show-signal
stick_menu=default

[option.position_x]
type=logical_x
label=X position
default=460
min=0
max=1919
arg=--x
stick_menu=optional

[option.position_y]
type=logical_y
label=Y position
default=18
min=0
max=1079
arg=--y
stick_menu=optional

[option.width]
type=logical_width
label=Width
default=1000
min=500
max=1920
arg=--width
stick_menu=optional

[option.height]
type=logical_height
label=Height
default=70
min=40
max=1080
arg=--height
stick_menu=optional

[option.refresh_hz]
type=integer
label=Refresh rate
default=4
min=1
max=30
arg=--hz
stick_menu=optional

[option.text_px]
type=integer
label=Text size
default=20
min=10
max=40
arg=--text-px
stick_menu=default

[option.background_opacity]
type=integer
label=Background opacity
default=59
min=0
max=100
arg=--background-opacity
stick_menu=default
step=1
unit=%
transform=percent_to_alpha

[option.stale_timeout_ms]
type=integer
label=Voltage stale timeout
default=3000
min=0
max=60000
arg=--stale-ms
stick_menu=optional

[option.status_file]
type=string
label=Voltage status source
default=/tmp/ghost_gx_bb_status
arg=--status-file
hidden=true
stick_menu=never

[option.info_file]
type=string
label=Link information source
default=/dev/shm/fpv-shm-info
arg=--info-file
hidden=true
stick_menu=never
